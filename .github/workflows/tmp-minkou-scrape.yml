name: Temporary Minkou Deviation Scrape
on:
  push:
    branches:
      - tmp-minkou-scrape-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Scrape Minkou deviation pages
        run: python scripts/minkou_deviation_scrape.py
      - name: Show manifest
        if: always()
        run: |
          cat minkou_deviation_output/manifest.json || true
          cat minkou_deviation_output/errors.json || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minkou-deviation-data
          path: minkou_deviation_output/
          retention-days: 1
